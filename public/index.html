<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexium</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#10161f;--card:#1d2633;--card2:#26334a;--blue:#45aef5;--tx:#fff;--mute:#8794a1;--up:#57c778;--down:#ff5f5f}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font:15px/1.4 Inter,system-ui,sans-serif;padding:max(14px,env(safe-area-inset-top)) 16px 100px;overflow-x:hidden}
.num,h1,h2,h3,.tabs button,.btn{font-family:Montserrat,Inter,sans-serif}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#45aef5,#7b61ff);display:grid;place-items:center;font:700 15px Montserrat}
.top b{font:600 15px Montserrat}.pill{margin-left:auto;background:var(--card);border:0;color:var(--mute);padding:8px 12px;border-radius:99px;font:500 13px Inter;display:flex;gap:6px}
.pill b{color:var(--tx);font:600 13px Inter}
.bal{text-align:center;padding:22px 0 20px}.bal .sub{font-size:14px}
.total{font:800 40px/1.1 Montserrat;letter-spacing:-.03em;margin-top:6px}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.act{background:var(--card);border:0;color:var(--tx);border-radius:16px;padding:14px 4px 12px;font:500 12.5px Inter;display:flex;flex-direction:column;gap:8px;align-items:center}
.act svg{width:26px;height:26px;stroke:var(--blue);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.act:active,.btn:active,.chip:active{transform:scale(.96)}
.sec{font:700 18px Montserrat;margin:4px 2px 12px}
.list{background:var(--card);border-radius:16px;overflow:hidden;margin-bottom:18px}
.row{display:flex;align-items:center;gap:12px;padding:13px 16px}.row+.row{border-top:1px solid rgba(255,255,255,.05)}
.coin{border-radius:50%;display:grid;place-items:center;flex:none;font:700 17px Montserrat;color:#fff;background:linear-gradient(145deg,var(--c),color-mix(in srgb,var(--c) 70%,#000))}
.coin svg{width:55%;height:55%}
.grow{flex:1;min-width:0}.grow b{font-weight:600}.sub{color:var(--mute);font-size:13px}.r{text-align:right}
.up{color:var(--up)}.down{color:var(--down)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(16,22,31,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.06);padding:8px 6px max(8px,env(safe-area-inset-bottom))}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:600 11px Montserrat;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs .on{color:var(--blue)}
.pane{display:none}.pane.on{display:block;animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:9}.sheet.show{display:flex}
.card{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out;max-height:90vh;overflow:auto}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--card2);margin:0 auto 14px}
.card h3{font:700 20px Montserrat;margin-bottom:14px;text-align:center}
.lbl{color:var(--mute);font-size:13px;margin:2px 4px 6px}
input,select{width:100%;background:var(--bg);border:1.5px solid transparent;color:var(--tx);padding:15px;border-radius:14px;font:500 16px Inter;margin-bottom:12px;outline:0;appearance:none}
input:focus,select:focus{border-color:var(--blue)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:10px}.eq{grid-template-columns:1fr 1fr}
.btn{width:100%;border:0;background:var(--blue);color:#001a2e;padding:16px;border-radius:14px;font:700 15px Montserrat}
.btn.sec2{background:var(--card2);color:var(--tx)}.btn.g{background:var(--up);color:#06210f}.btn.rd{background:var(--down);color:#2b0505}.btn:disabled{opacity:.5}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chip{border:0;background:var(--card);color:var(--mute);padding:9px 16px;border-radius:99px;font:600 13px Montserrat;flex:none}.chip.on{background:var(--blue);color:#001a2e}
.chart{background:var(--card);border-radius:16px;padding:16px 0 0;margin-bottom:12px;overflow:hidden}
.chart .hd{padding:0 16px;display:flex;justify-content:space-between;align-items:baseline}
.px{font:700 24px Montserrat}canvas{width:100%;height:170px;display:block}
.toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-90px);background:var(--card2);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;z-index:20;transition:.3s;max-width:90%;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.toast.show{transform:translate(-50%,0)}.toast.bad{background:var(--down);color:#2b0505}
.chk{word-break:break-all;background:var(--bg);padding:14px;border-radius:14px;margin-bottom:12px;font-size:14px}
.empty{padding:26px 20px;text-align:center;color:var(--mute);font-size:14px}
.tag{font-size:11px;background:var(--down);color:#2b0505;padding:2px 7px;border-radius:99px;margin-left:6px;font-weight:600}
.box{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px}.box h3{font:700 15px Montserrat;margin-bottom:12px}
.hd2{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.hd2 .btn{width:auto;padding:10px 18px;font-size:13px}
.mini{width:auto;padding:9px 16px;font-size:13px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<section class="pane on" id="p-w">
 <div class="top"><div class="av" id="av">N</div><b id="nm">Nexium</b><button class="pill" id="widBtn">ID <b id="wid">…</b></button></div>
 <div class="bal"><div class="sub">Общий баланс</div><div class="total" id="total">$0.00</div></div>
 <div class="acts">
  <button class="act" data-a="send"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>Отправить</button>
  <button class="act" data-a="recv"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Получить</button>
  <button class="act" data-a="check"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Чек</button>
  <button class="act" data-t="p"><svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>P2P</button>
 </div>
 <div class="sec">Активы</div><div class="list" id="coins"></div>
</section>

<section class="pane" id="p-t">
 <div class="chips" id="pairs"></div>
 <div class="chart"><div class="hd"><div class="px" id="px">—</div><div class="sub" id="pc"></div></div><canvas id="cv"></canvas></div>
 <div class="chips" id="secs"></div>
 <div class="lbl">Ставка, USDT</div><input id="stake" inputmode="decimal" placeholder="от 1 USDT">
 <div class="sub" id="tbal" style="margin:-4px 4px 14px"></div>
 <div class="two eq"><button class="btn g" id="bUp">▲ Вверх</button><button class="btn rd" id="bDn">▼ Вниз</button></div>
 <div class="sec" style="margin-top:22px">Открытые</div><div class="list" id="open"></div>
 <div class="sec">Закрытые</div><div class="list" id="done"></div>
</section>

<section class="pane" id="p-p">
 <div class="hd2"><div class="sec" style="margin:0">P2P-обмен</div><button class="btn" id="pNew">Создать</button></div>
 <div class="list" id="offers"></div>
</section>

<section class="pane" id="p-h"><div class="sec">История</div><div class="list" id="hist"></div></section>

<section class="pane" id="p-a">
 <div class="sec">Админ-панель</div>
 <div class="box"><div class="sub">Пользователей: <b id="aN" style="color:#fff">–</b></div><div class="sub" style="margin-top:4px">В системе: <span id="aT"></span></div></div>
 <div class="box"><h3>Выдать / списать</h3><input id="gTo" placeholder="Telegram ID или ID кошелька"><div class="two"><input id="gAmt" inputmode="decimal" placeholder="Сумма (−5 списать)"><select id="gCur" class="cursel"></select></div><button class="btn" id="gBtn">Выдать</button></div>
 <div class="box"><h3>Сменить ID кошелька</h3><input id="wTo" placeholder="Telegram ID или текущий ID"><input id="wNew" placeholder="Новый ID, например KELD"><button class="btn" id="wBtn">Сменить</button></div>
 <div class="box"><h3>Блокировка</h3><input id="bTo" placeholder="Telegram ID или ID кошелька"><div class="two eq"><button class="btn rd" id="bOn">Забанить</button><button class="btn sec2" id="bOff">Разбанить</button></div></div>
 <div class="sec">Пользователи</div><div class="list" id="aList"></div>
</section>

<nav class="tabs">
 <button class="on" data-t="w"><svg viewBox="0 0 24 24"><path d="M4 7h15a1 1 0 0 1 1 1v11H5a1 1 0 0 1-1-1zM4 7l12-3v3M16 13h2"/></svg>Кошелёк</button>
 <button data-t="t"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9M15 6h5v5"/></svg>Трейд</button>
 <button data-t="p"><svg viewBox="0 0 24 24"><path d="M7 7h12l-3-3M17 17H5l3 3"/></svg>P2P</button>
 <button data-t="h"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>История</button>
 <button data-t="a" id="tabA" hidden><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Админ</button>
</nav>
<div class="sheet" id="sheet"><div class="card" id="card"></div></div><div class="toast" id="toast"></div>

<script>
const tgw=window.Telegram?.WebApp;tgw?.ready();tgw?.expand();tgw?.setHeaderColor?.('#10161f');tgw?.setBackgroundColor?.('#10161f');
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const C={TON:{c:'#0098ea',n:'Toncoin',id:'the-open-network'},BTC:{c:'#f7931a',n:'Bitcoin',id:'bitcoin'},ETH:{c:'#627eea',n:'Ethereum',id:'ethereum'},USDT:{c:'#26a17b',n:'Tether',id:'tether'},SOL:{c:'#9945ff',n:'Solana',id:'solana'}};
const PAIR={BTC:'BTCUSDT',ETH:'ETHUSDT',TON:'TONUSDT',SOL:'SOLUSDT'};
const GL={TON:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M5 7h14l-7 12z"/><path d="M12 7v12"/></svg>',SOL:'<svg viewBox="0 0 24 24" fill="#fff"><path d="M6 5h14l-2 3H4zM4 10.5h14l2 3H6zM6 16h14l-2 3H4z"/></svg>',BTC:'₿',ETH:'Ξ',USDT:'₮'};
const ico=(k,s=44)=>`<div class="coin" style="--c:${C[k].c};width:${s}px;height:${s}px">${GL[k]}</div>`;
let S={me:null,admin:false},P={},mode='',T={c:'BTC',sec:60,pts:[]},LK='';
const usd=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:n<1?4:2});
const amt=n=>(+n).toLocaleString('ru-RU',{maximumFractionDigits:8});
const opts=(sel='')=>Object.keys(C).map(k=>`<option ${k===sel?'selected':''}>${k}</option>`).join('');
function toast(t,bad){const e=$('#toast');e.textContent=t;e.className='toast show'+(bad?' bad':'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='toast',2500)}
async function api(action,d={}){
 try{const r=await fetch('/api/app',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({initData:tgw?.initData||'',action,...d})});
 const j=await r.json();if(!r.ok){toast(j.err||'Ошибка',1);return null}
 if(j.me){S.me=j.me;S.admin=j.isAdmin;render()}return j}catch{toast('Нет связи с сервером',1)}}
async function rates(){try{const ids=Object.values(C).map(x=>x.id).join(',');
 const j=await(await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`)).json();
 for(const k in C){const x=j[C[k].id];if(x)P[k]={p:x.usd,d:x.usd_24h_change||0}}render()}catch{}}

const TYPE={in:['Получено','↓'],out:['Отправлено','↑'],check_in:['Чек активирован','↓'],check_out:['Чек списан','↑'],admin:['Начисление','★'],trade_bet:['Ставка','▲'],trade_win:['Выигрыш','★'],p2p_buy:['P2P покупка','⇄'],p2p_sell:['P2P продажа','⇄']};
function render(){const m=S.me;if(!m)return;
 $('#nm').textContent=m.name||'Кошелёк';$('#av').textContent=(m.name||'N')[0].toUpperCase();$('#wid').textContent=m.wid;$('#tabA').hidden=!S.admin;
 let t=0;
 $('#coins').innerHTML=Object.keys(C).map(k=>{const b=m.bal[k]||0,p=P[k];t+=b*(p?.p||0);
  return `<div class="row">${ico(k)}<div class="grow"><b>${C[k].n}</b><div class="sub">${p?usd(p.p):'…'} <span class="${p?.d>=0?'up':'down'}">${p?(p.d>=0?'+':'')+p.d.toFixed(2)+'%':''}</span></div></div><div class="r"><b>${amt(b)} ${k}</b><div class="sub">${p?usd(b*p.p):''}</div></div></div>`}).join('');
 $('#total').textContent=usd(t);
 $('#hist').innerHTML=m.tx.length?m.tx.map(x=>{const L=TYPE[x.t]||[x.t,'•'];return `<div class="row"><div class="coin" style="--c:${x.a>=0?'#2f8f55':'#55627a'};width:40px;height:40px">${L[1]}</div><div class="grow"><b>${L[0]}</b><div class="sub">${new Date(x.ts).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}${x.w?' · '+x.w:''}</div></div><b class="${x.a>=0?'up':'down'}">${x.a>0?'+':''}${amt(x.a)} ${x.c}</b></div>`}).join(''):'<div class="empty">Операций пока нет</div>';
 $('#tbal').textContent='Баланс: '+amt(m.bal.USDT||0)+' USDT · верный прогноз платит 1.85×';
 $('#open').innerHTML=(m.open||[]).length?m.open.map(t=>`<div class="row">${ico(t.coin,40)}<div class="grow"><b>${t.coin} ${t.dir==='up'?'<span class="up">▲</span>':'<span class="down">▼</span>'}</b><div class="sub">вход ${usd(t.px)}</div></div><div class="r"><b>${amt(t.st)} USDT</b><div class="sub cd" data-e="${t.exp}"></div></div></div>`).join(''):'<div class="empty">Открытых сделок нет</div>';
 $('#done').innerHTML=(m.done||[]).length?m.done.map(t=>`<div class="row">${ico(t.coin,40)}<div class="grow"><b>${t.coin} ${t.dir==='up'?'▲':'▼'}</b><div class="sub">${usd(t.px)} → ${usd(t.cl)}</div></div><b class="${t.r==='win'?'up':t.r==='lose'?'down':''}">${t.r==='win'?'+'+amt(t.pay-t.st):t.r==='lose'?'−'+amt(t.st):'0'} USDT</b></div>`).join(''):'<div class="empty">Пока пусто</div>'}

function sheet(h){$('#card').innerHTML='<div class="grab"></div>'+h;$('#sheet').classList.add('show')}
const shut=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')shut()};
const forms={
 send:()=>{mode='send';sheet(`<h3>Отправить</h3><div class="lbl">ID кошелька получателя</div><input id="f1" placeholder="NX1234567" autocapitalize="characters"><div class="lbl">Сумма и монета</div><div class="two"><input id="f2" inputmode="decimal" placeholder="0"><select id="f3">${opts('TON')}</select></div><button class="btn" id="go">Отправить</button>`)},
 check:()=>{mode='check';sheet(`<h3>Создать чек</h3><div class="two"><input id="f2" inputmode="decimal" placeholder="Сумма"><select id="f3">${opts('USDT')}</select></div><button class="btn" id="go">Создать</button><div class="sub" style="margin-top:14px;text-align:center">Монеты спишутся с твоего баланса, когда чек заберут. В чате: <b style="color:#fff">@NexiumWallet_bot 1 TON</b></div>`)},
 recv:()=>{mode='recv';sheet(`<h3>Получить</h3><div class="lbl" style="text-align:center">Твой ID кошелька</div><div class="chk num" style="font-size:24px;text-align:center">${S.me.wid}</div><button class="btn" id="go">Скопировать ID</button>`)}};
function go(t){$$('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));$$('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));scrollTo(0,0);
 if(t==='a')admin();if(t==='p')p2pLoad();if(t==='t'){api('settle');tick()}}

/* Трейд */
const drawChips=()=>{$('#pairs').innerHTML=Object.keys(PAIR).map(k=>`<button class="chip ${k===T.c?'on':''}" data-pair="${k}">${k}/USDT</button>`).join('');
 $('#secs').innerHTML=[[30,'30 сек'],[60,'1 мин'],[300,'5 мин']].map(([s,l])=>`<button class="chip ${s===T.sec?'on':''}" data-sec="${s}">${l}</button>`).join('')};
function chart(){const cv=$('#cv'),d=devicePixelRatio||1,w=cv.clientWidth*d,h=cv.clientHeight*d;if(cv.width!==w){cv.width=w;cv.height=h}
 const x=cv.getContext('2d'),a=T.pts;x.clearRect(0,0,w,h);if(a.length<2)return;
 const mn=Math.min(...a),mx=Math.max(...a),r=(mx-mn)||1,X=i=>i/(a.length-1)*(w-14*d),Y=v=>h-14*d-(v-mn)/r*(h-44*d);
 const up=a[a.length-1]>=a[0],col=up?'#57c778':'#ff5f5f',g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,col+'55');g.addColorStop(1,col+'00');
 x.beginPath();a.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=col;x.lineWidth=2.5*d;x.lineJoin='round';x.stroke();
 const lx=X(a.length-1),ly=Y(a[a.length-1]);x.lineTo(lx,h);x.lineTo(0,h);x.fillStyle=g;x.fill();
 x.beginPath();x.arc(lx,ly,5*d,0,7);x.fillStyle=col;x.fill();x.beginPath();x.arc(lx,ly,10*d,0,7);x.fillStyle=col+'33';x.fill();
 $('#pc').innerHTML=`<span class="${up?'up':'down'}">${up?'+':''}${((a[a.length-1]/a[0]-1)*100).toFixed(3)}%</span>`}
async function tick(){if(!$('#p-t').classList.contains('on'))return;
 try{const j=await(await fetch('https://api.binance.com/api/v3/ticker/price?symbol='+PAIR[T.c])).json(),v=+j.price;
 T.pts.push(v);T.pts=T.pts.slice(-80);$('#px').textContent=usd(v);chart()}catch{}}
async function trade(dir){const r=await api('trade_open',{coin:T.c,dir,amt:$('#stake').value,sec:T.sec});if(r)toast('Сделка открыта')}

/* P2P */
async function p2pLoad(){const r=await api('p2p_list');if(!r)return;
 $('#offers').innerHTML=r.offers.length?r.offers.map(o=>{const mine=o.o===S.me.id;return `<div class="row">${ico(o.sc,40)}<div class="grow"><b>${amt(o.sa)} ${o.sc}</b><div class="sub">за ${amt(o.wa)} ${o.wc} · ${o.ow}</div></div><button class="chip on mini" data-p2p="${mine?'p2p_cancel':'p2p_buy'}" data-id="${o.id}">${mine?'Снять':'Купить'}</button></div>`}).join(''):'<div class="empty">Объявлений пока нет. Создай первое: выставь монеты и укажи, что хочешь взамен.</div>'}

/* Админ */
async function admin(){const r=await api('a_stats');if(!r)return;
 $('#aN').textContent=r.users.length;$('#aT').textContent=Object.entries(r.tot).map(([k,v])=>amt(v)+' '+k).join(', ')||'пусто';
 $('#aList').innerHTML=r.users.map(u=>`<div class="row"><div class="av" style="width:38px;height:38px">${(u.name||'?')[0].toUpperCase()}</div><div class="grow"><b>${u.name||'—'}</b>${u.banned?'<span class="tag">бан</span>':''}<div class="sub">${u.wid} · tg ${u.id}</div></div><div class="r sub">${Object.entries(u.bal).filter(x=>x[1]).map(([k,v])=>amt(v)+' '+k).join('<br>')}</div></div>`).join('')}
const done=async(a,d)=>{const r=await api(a,d);if(r){toast(r.done||'Готово');admin()}};

document.addEventListener('click',async e=>{
 const b=e.target.closest('button');if(!b)return;const d=b.dataset,id=b.id;
 if(d.a)return forms[d.a]();if(d.t)return go(d.t);
 if(d.pair){T.c=d.pair;T.pts=[];drawChips();return tick()}if(d.sec){T.sec=+d.sec;return drawChips()}
 if(d.p2p){const r=await api(d.p2p,{id:d.id});if(r){toast(d.p2p==='p2p_buy'?'Обмен выполнен':'Объявление снято');p2pLoad()}return}
 if(id==='widBtn'||(id==='go'&&mode==='recv')){navigator.clipboard?.writeText(S.me.wid);return toast('ID скопирован')}
 if(id==='go'&&mode==='send'){const r=await api('send',{to:$('#f1').value,amt:$('#f2').value,cur:$('#f3').value});if(r){shut();toast('Отправлено')}return}
 if(id==='go'&&mode==='check'){const a=$('#f2').value,c=$('#f3').value,r=await api('mkcheck',{amt:a,cur:c});
  if(r){LK=r.link;window.lkT='Чек на '+a+' '+c;sheet(`<h3>Чек готов</h3><div class="chk">${r.link}</div><button class="btn" id="sh">Поделиться</button><button class="btn sec2" id="cp" style="margin-top:8px">Скопировать ссылку</button>`)}return}
 if(id==='cp'){navigator.clipboard?.writeText(LK);return toast('Ссылка скопирована')}
 if(id==='sh')return tgw?tgw.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(LK)+'&text='+encodeURIComponent(window.lkT)):0;
 if(id==='bUp')return trade('up');if(id==='bDn')return trade('down');
 if(id==='pNew'){sheet(`<h3>Новое объявление</h3><div class="lbl">Отдаю (уйдёт в залог)</div><div class="two"><input id="f1" inputmode="decimal" placeholder="Сумма"><select id="f2">${opts('USDT')}</select></div><div class="lbl">Хочу получить</div><div class="two"><input id="f3" inputmode="decimal" placeholder="Сумма"><select id="f4">${opts('TON')}</select></div><button class="btn" id="goP">Опубликовать</button>`);return}
 if(id==='goP'){const r=await api('p2p_make',{sa:$('#f1').value,sc:$('#f2').value,wa:$('#f3').value,wc:$('#f4').value});if(r){shut();toast('Опубликовано');p2pLoad()}return}
 if(id==='gBtn')return done('a_give',{to:$('#gTo').value,amt:$('#gAmt').value,cur:$('#gCur').value});
 if(id==='wBtn')return done('a_setwid',{to:$('#wTo').value,wid:$('#wNew').value});
 if(id==='bOn')return done('a_ban',{to:$('#bTo').value,on:true});
 if(id==='bOff')return done('a_ban',{to:$('#bTo').value,on:false});
});
$('#gCur').innerHTML=opts('USDT');
setInterval(()=>{let due=0;$$('.cd').forEach(e=>{const s=Math.ceil((+e.dataset.e-Date.now())/1000);if(s<=0){e.textContent='расчёт…';due=1}else e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')});
 if(due&&!window.stl){window.stl=1;api('settle').then(r=>{window.stl=0;const t=r?.me.done?.[0];if(t&&Date.now()-t.exp<20000)toast('Сделка закрыта: '+({win:'выигрыш',lose:'проигрыш',tie:'ничья'})[t.r])})}},1000);
setInterval(tick,2000);drawChips();api('settle');rates();setInterval(rates,45000);
